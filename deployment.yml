---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-1
  namespace: cycle-ns
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      imagePullSecrets:
        - name: dockerhub-secret 
      containers:
        - name: cycle-container
          image: karkamprashanth/pratice:cycle
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "100Mi"
            limits:
              cpu: "200m"
              memory: "200Mi"
          envFrom:
            - configMapRef:
                name: cycle-cm
