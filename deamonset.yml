---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: deamonset-1
  namespace: cycle-ns
spec:
  selector:
    matchLabels:
      app: dm
  template:
    metadata:
      labels:
        app: dm
    spec:
      containers:
        - name: deamon-container
          image: karkamprashanth/task:cycle
          ports:
            - containerPort: 80
