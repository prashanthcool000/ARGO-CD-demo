---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: deamonset-1
spec:
  selector:
    matchLabels:
      app: dm
  template:
    metadata:
      labels:
        app: dm
    spec:
      containers:
        - name: deamon-container
          image: karkamprashanth/task:cycle
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "50Mi"
            limits:
              cpu: "100m"
              memory: "100Mi"

